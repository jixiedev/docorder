name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install jsonnet
        run: sudo apt-get update && sudo apt-get install -y jsonnet
      - name: Install project
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check
      - name: Check the documentation site is up to date
        run: |
          uv run python scripts/build_figures.py
          uv run python scripts/build_docs.py
          git diff --exit-code docs/guide.md docs/guide.en.md docs/site
      - name: Run the documentation example
        run: uv run python examples/data-governance/documentation/job.py
