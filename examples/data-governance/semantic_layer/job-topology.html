  <div class="frame">
    <p class="eyebrow">Architecture · docorder semantic_layer</p>
    <h1>21 个算子，一条链</h1>
    <p class="caption">
      四个 job 串起来看就是这样。上游 dbt model 的 <code>.sql</code> 与 <code>.yml</code> 进，
      词根表、词根成员表、指标成员归属 JSON 出。每个方框左边是算子身份与类型色，右边是这个算子
      干什么；右上角黑点表示该算子会调大模型。
      <b>链上三处紫色虚线带是 <code>.staging/</code> 交接点</b>：job 之间不共享内存，
      数据必须写进磁盘再读回来，引擎的失效传播看不见这条边。
      图里不带任何数量——当前只是跑一个 sample，模型数、词根数和调用次数都会随数据量变。
    </p>
